# 演示用 PostgreSQL（M11 起项目默认方言）。
#   docker compose up -d      # 起库
#   docker compose down -v    # 清库（连数据一起删）
# 默认值必须与 DbSupport 里的默认值一致：agent_runtime / postgres / postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-runtime-pg
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_runtime"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent-runtime-pg:/var/lib/postgresql/data

volumes:
  agent-runtime-pg:
